[project]
name = "ocelescope-module-streaming"
version = "0.1.0"
readme = "README.md"
description = "Object-centric process discovery on event streams with bounded buffers and eviction heuristics"
authors = [{ name = "Menne, Sebastian" }]
requires-python = ">=3.11"
dependencies = [
  "ocelescope-backend>=0.12.0",
]

[dependency-groups]
dev = ["pyright>=1.1.400", "pytest>=8", "ruff>=0.12"]

[project.entry-points."ocelescope_backend.modules"]
streaming = "ocelescope_module_streaming.module:Streaming"

[build-system]
requires = ["uv_build>=0.9.26,<0.12.0"]
build-backend = "uv_build"

[tool.uv]
package = true

[tool.ruff]
line-length = 120
extend-exclude = ["*.md"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]


[tool.pyright]
include = ["src", "tests"]
extraPaths = ["src", "tests"]
typeCheckingMode = "standard"

[tool.pytest.ini_options]
testpaths = ["tests"]
